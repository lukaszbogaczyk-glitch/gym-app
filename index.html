<style>
/* Layout: jedna kolumna jak w aplikacji na telefon, dolny pasek zakładek, karty tylko dla rzeczy, którymi się operuje */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --ink:#14181B; --muted:#5D6870; --line:#D3D9DD;
  --accent:#2C55D8; --accent-ink:#FFFFFF; --good:#1E8A4C; --warn:#B86A00; --soft:#E1E7F7;
  --hero:#16213D; --hero-ink:#F3F6FF; --hero-muted:#AEB9D6; --body:#B7C1CA; --skin:#D6DDE3; --energy:#F0A202;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1316; --surface:#181D21; --ink:#E7ECEF; --muted:#94A0A8; --line:#2A3238;
  --accent:#6E8FF5; --accent-ink:#0C1020; --good:#4CC284; --warn:#E0A247; --soft:#1E2740; --hero:#1C2A4F; --hero-ink:#F3F6FF; --hero-muted:#AEB9D6; --body:#3A444D; --skin:#262E35; --energy:#F5B83A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1316; --surface:#181D21; --ink:#E7ECEF; --muted:#94A0A8; --line:#2A3238;
  --accent:#6E8FF5; --accent-ink:#0C1020; --good:#4CC284; --warn:#E0A247; --soft:#1E2740; --hero:#1C2A4F; --hero-ink:#F3F6FF; --hero-muted:#AEB9D6; --body:#3A444D; --skin:#262E35; --energy:#F5B83A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2rem;text-transform:uppercase}
h2{font-size:1.5rem;text-transform:uppercase}
h3{font-size:1.15rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
button,.btn{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--warn)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.banner{background:var(--soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.9rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs button{border:0;border-radius:0;background:transparent;padding:10px 2px 12px;font-size:.68rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.03em}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.ex{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 34px;gap:6px;align-items:center}
.sets input{width:100%;text-align:center}
.sets .hd{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center}
.chip{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);white-space:nowrap}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)}
.insight{display:flex;gap:10px;align-items:flex-start}
.insight .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none;background:var(--accent)}
.insight.good .dot{background:var(--good)} .insight.warn .dot{background:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-family:var(--f-num);font-size:1.3rem}
.chartbox{overflow-x:auto}
svg.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.tip{border-left:3px solid var(--line);padding-left:12px}
.tip h3{margin-bottom:4px}
.note-meta{font-size:.78rem;color:var(--muted)}
.check{width:22px;height:22px;accent-color:var(--good)}
.en{font-size:.8rem;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;position:sticky;top:8px;z-index:5}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:.88rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.plancard{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:12px}
.plancard[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset;background:var(--soft)}
.plancard .pc-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.plancard .pc-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plancard small{color:var(--muted);font-weight:500;font-size:.78rem}
.plancard .pc-days{grid-column:1/-1;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px;font-weight:400;font-size:.8rem;color:var(--muted)}
.plancard .pc-days b{display:block;color:var(--ink);font-weight:600;font-size:.86rem}
.planhead h2{margin:0}
.install{border-color:var(--accent);background:var(--soft)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chips button{white-space:nowrap;border-radius:999px;padding:5px 12px;font-size:.82rem}
.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dbrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.dbrow:first-of-type{border-top:0}
.refs{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem}
.refs>div{display:flex;flex-direction:column;gap:2px;min-width:0}
/* hero: granatowa płyta z radełkowaniem jak na gryfie sztangi */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(45deg,#fff 0 1px,transparent 1px 7px),repeating-linear-gradient(-45deg,#fff 0 1px,transparent 1px 7px);pointer-events:none}
.hero>*{position:relative;min-width:0}
.hero .htitle{grid-column:1/-1}
.hero .eyebrow{color:var(--hero-muted)}
.hero h1{font-size:2.2rem}
.hero .groups{display:flex;flex-wrap:wrap;gap:6px}
.hero .gchip{background:rgba(255,255,255,.1);color:var(--hero-ink)}
.hero button.primary{white-space:nowrap;background:var(--energy);border-color:var(--energy);color:#1A1300;font-size:1rem;padding:10px 18px}
.hero-stats{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.ring{display:flex;align-items:center;gap:8px}
.ring b{font-family:var(--f-num);font-size:1.1rem;display:block}
.ring small,.streak small{color:var(--hero-muted);font-size:.72rem;display:block}
.streak{display:flex;align-items:center;gap:6px}
.streak b{font-family:var(--f-num);font-size:1.1rem;display:block}
.bodymap{display:block}
.gchip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:3px 9px 3px 6px;border-radius:999px;background:var(--bg);color:var(--ink);white-space:nowrap}
.gchip i{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.daycard{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.daycard>div{min-width:0;display:flex;flex-direction:column;gap:8px}
.exhead{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.ghead{display:flex;align-items:center;gap:10px}
.ghead h2{flex:1}
.tipday{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.tipicon{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--surface)}
.tipicon svg{width:30px;height:30px;stroke:var(--accent);fill:none;stroke-width:1.8}
.stat .ic{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.8;float:right}
/* medal po rekordzie */
.celebrate{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(10,14,24,.55);padding:24px}
.celebrate .box{background:var(--surface);color:var(--ink);border-radius:18px;padding:22px;max-width:360px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.celebrate h2{font-size:2rem}

.celebrate li{background:var(--bg);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;text-align:left}

  .celebrate .box{animation:pop .45s cubic-bezier(.2,1.4,.4,1) both}
  .medal{animation:swing 1.6s ease-in-out .3s 2}
  .ring circle.prog{transition:stroke-dashoffset .8s ease-out}
}

@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.medal{transform-origin:50% 0}

.eqhead{display:flex;align-items:center;gap:8px;padding:12px 0 4px;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line)}
.eqhead:first-child{border-top:0;padding-top:0}
.eqhead span:nth-child(2){flex:1}

.chips button.eqchip{display:inline-flex;align-items:center;gap:5px}

.mic{display:inline-flex;align-items:center;gap:6px}

.exlink:hover,.exlink:focus-visible{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.exlink:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.infoi{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--muted);color:var(--muted);font:700 11px/1 var(--f-body);vertical-align:2px;margin-left:2px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,24,.5);z-index:15}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:16;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto}
.sheet-grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}

@media (prefers-reduced-motion:no-preference){.sheet{animation:up .25s ease-out}}
@keyframes up{from{transform:translateY(30px);opacity:.001}to{transform:none;opacity:1}}
.aibtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px}

.aicard{border-color:var(--accent)}
.aithumb{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

<script>
const KEY='silownia.v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('pl-PL',{day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function seed(){
  const plan=[
    {id:'a',name:'Dzień A · Push',exercises:[{id:uid(),name:'Wyciskanie sztangi na ławce',sets:4,reps:8},{id:uid(),name:'Wyciskanie hantli nad głowę',sets:3,reps:10},{id:uid(),name:'Pompki na poręczach',sets:3,reps:10}]},
    {id:'b',name:'Dzień B · Pull',exercises:[{id:uid(),name:'Martwy ciąg',sets:3,reps:5},{id:uid(),name:'Wiosłowanie sztangą',sets:4,reps:8},{id:uid(),name:'Podciąganie na drążku',sets:3,reps:8}]},
    {id:'c',name:'Dzień C · Nogi',exercises:[{id:uid(),name:'Przysiad ze sztangą',sets:4,reps:6},{id:uid(),name:'Wykroki z hantlami',sets:3,reps:10},{id:uid(),name:'Wspięcia na palce',sets:3,reps:15}]}
  ];
  const base={'Wyciskanie sztangi na ławce':60,'Wyciskanie hantli nad głowę':16,'Pompki na poręczach':0,'Martwy ciąg':90,'Wiosłowanie sztangą':50,'Podciąganie na drążku':0,'Przysiad ze sztangą':70,'Wykroki z hantlami':14,'Wspięcia na palce':40};
  const sessions=[];const bw=[];
  const now=new Date();
  for(let w=5;w>=0;w--){
    ['a','b','c'].forEach((dayId,i)=>{
      const d=new Date(now);d.setDate(d.getDate()-w*7-(6-i*2));
      if(d>now)return;
      const day=plan.find(p=>p.id===dayId);
      sessions.push({id:uid(),date:d.toISOString().slice(0,10),dayId,dayName:day.name,
        entries:day.exercises.map(e=>({name:e.name,sets:Array.from({length:e.sets},()=>({w:base[e.name]+(5-w)*(base[e.name]>=40?2.5:base[e.name]>0?1:0),r:e.reps}))}))});
    });
    const d=new Date(now);d.setDate(d.getDate()-w*7);
    bw.push({date:d.toISOString().slice(0,10),kg:+(82.4-(5-w)*0.3).toFixed(1)});
  }
  sessions.sort((a,b)=>a.date.localeCompare(b.date));
  const n1=new Date(now);n1.setDate(n1.getDate()-9);
  const n2=new Date(now);n2.setDate(n2.getDate()-3);
  const plans=[{id:'ppl',name:'Push Pull Legs',days:plan},
    {id:'fbw',name:'FBW na wyjazd',days:[
      {id:'f1',name:'FBW 1',exercises:[{id:uid(),name:'Przysiad goblet',sets:3,reps:12},{id:uid(),name:'Pompki',sets:3,reps:15},{id:uid(),name:'Wiosłowanie hantlem jednorącz',sets:3,reps:12}]},
      {id:'f2',name:'FBW 2',exercises:[{id:uid(),name:'Martwy ciąg rumuński z hantlami',sets:3,reps:10},{id:uid(),name:'Wyciskanie hantli nad głowę',sets:3,reps:10},{id:uid(),name:'Deska',sets:3,reps:45}]}]}];
  sessions.forEach(x=>x.planId='ppl');
  return {example:true,plans,activePlan:'ppl',sessions,bodyweight:bw,notes:[
    {id:uid(),date:n1.toISOString().slice(0,10),tag:'Samopoczucie',text:'Po słabym śnie przysiad szedł ciężko. Warto pilnować 7+ godzin przed dniem nóg.'},
    {id:uid(),date:n2.toISOString().slice(0,10),tag:'Technika',text:'Szersze ustawienie łokci przy wyciskaniu odciąża bark. Zostaję przy tym.'}]};
}

let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){S=JSON.parse(r);migrate();return}}catch(e){}S=seed()}
// starsze dane miały jeden plan (S.plan = lista dni); teraz są osobne, nazwane plany (S.plans), jeden aktywny
function migrate(){
  if(!Array.isArray(S.plans))S.plans=[{id:uid(),name:'Mój plan',days:Array.isArray(S.plan)?S.plan:[]}];
  delete S.plan;
  S.plans.forEach(p=>{p.days=p.days||[];p.days.forEach(d=>d.exercises=d.exercises||[])});
  if(!S.plans.some(p=>p.id===S.activePlan))S.activePlan=S.plans[0]?.id||null;
  S.sessions=S.sessions||[];S.bodyweight=S.bodyweight||[];S.notes=S.notes||[];
}

function voiceShow(text,final){
  const t=document.getElementById('ai-desc');

  if(final){voice.base=joined;ui.ai.desc=joined}

function voiceSet(on){voice.on=on;const b=document.getElementById('ai-mic');if(b){b.classList.toggle('rec',on);b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?'Słucham… stuknij, by zakończyć':'Podyktuj'}if(!on){const t=document.getElementById('ai-desc');if(t){t.value=ui.ai.desc}}}

  if(voice.on){if(dictApi)dictApi.stop().catch(()=>{});else voice.rec?.stop();return}

  if(dictApi){dictApi.start({language:'pl'}).catch(e=>{voiceSet(false);if(e?.code==='not_granted')toast('Nie zezwolono na użycie mikrofonu');else if(e?.code!=='stopped')toast('Dyktowanie jest teraz niedostępne')});voiceSet(true);return}
  const rec=new SR();rec.lang='pl-PL';rec.interimResults=true;rec.continuous=true;
  rec.onresult=e=>{let fin='',part='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else part+=t}if(fin)voiceShow(fin.trim(),true);if(part)voiceShow(part.trim(),false)};
  rec.onerror=e=>{if(e.error==='not-allowed')toast('Nie zezwolono na użycie mikrofonu')};
  rec.onend=()=>voiceSet(false);
  voice.rec=rec;try{rec.start();voiceSet(true)}catch(e){toast('Dyktowanie jest teraz niedostępne')}
}

{"pl":"nazwa po polsku","en":"English name","group":"jedna z partii po angielsku","eq":"sprzęt","tip":"jedno zdanie wskazówki technicznej po polsku","steps":["3 krótkie kroki techniki po polsku"],"tips":["3 krótkie porady po polsku, ostatnia o częstym błędzie"],"confidence":"wysoka|średnia|niska","note":"krótka uwaga po polsku, jeśli coś jest niepewne, inaczej pusty"}`;

function parseJson(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error('AI nie zwróciło danych w oczekiwanym formacie.');return JSON.parse(m[0])}
const toB64=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(blob)});
async function shrink(file){ // zdjęcie z telefonu zmniejszamy do 1280 px, żeby było szybciej i taniej
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1280/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',.85))}catch(e){return file}
}
async function askAI(desc,photo){
  const prompt=aiPrompt(desc,!!photo);
  if(sampleApi){
    const opts={};if(photo)opts.images=[photo];
    return await sampleApi.json(prompt,opts);
  }
  if(!S.ai?.key)throw new Error('Brak klucza API. Wpisz go w ustawieniach AI poniżej.');
  const content=[];
  if(photo)content.push({type:'image',source:{type:'base64',media_type:photo.type||'image/jpeg',data:await toB64(photo)}});
  content.push({type:'text',text:prompt});
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':S.ai.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:S.ai.model||'claude-opus-5-5',max_tokens:2000,output_config:{effort:'low'},messages:[{role:'user',content}]})});
  const data=await res.json().catch(()=>({}));
  if(!res.ok){const m=data?.error?.message||res.statusText;throw new Error(res.status===401?'Klucz API jest nieprawidłowy.':res.status===429?'Za dużo zapytań, spróbuj za chwilę.':'Błąd API: '+m)}

}

const weekStart=d=>{const x=new Date(d+'T12:00:00');const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x.toISOString().slice(0,10)};
function weekStats(){
  const cur=weekStart(today());const weeks=new Set(S.sessions.map(s=>weekStart(s.date)));
  const thisWeek=S.sessions.filter(s=>weekStart(s.date)===cur).length;
  let streak=0;const d=new Date(cur+'T12:00:00');if(!weeks.has(cur))d.setDate(d.getDate()-7);
  while(weeks.has(d.toISOString().slice(0,10))){streak++;d.setDate(d.getDate()-7)}
  return{thisWeek,goal:S.goal||3,streak};
}
function ring(v,goal){const R=20,C=2*Math.PI*R,f=Math.min(v/goal,1);
  return `<svg width="50" height="50" viewBox="0 0 50 50" aria-hidden="true"><circle cx="25" cy="25" r="${R}" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6"/><circle class="prog" cx="25" cy="25" r="${R}" fill="none" stroke="var(--energy)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C*(1-f)).toFixed(1)}" transform="rotate(-90 25 25)"/></svg>`}

  const P=Array.from({length:140},()=>({x:W/2,y:H*.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-3,s:Math.random()*6+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));

/* ---------- wnioski (automatyczne obserwacje) ---------- */
function topSet(entry){return Math.max(0,...entry.sets.map(s=>+s.w||0))}
function exHistory(name){return S.sessions.filter(s=>s.entries.some(e=>e.name===name)).map(s=>({date:s.date,w:topSet(s.entries.find(e=>e.name===name)),vol:s.entries.find(e=>e.name===name).sets.reduce((a,x)=>a+(+x.w||0)*(+x.r||0),0)}))}
function allExercises(){const set=new Set();S.plans.forEach(p=>p.days.forEach(d=>d.exercises.forEach(e=>set.add(e.name))));S.sessions.forEach(s=>s.entries.forEach(e=>set.add(e.name)));return[...set]}
function insights(){
  const out=[];
  const last=S.sessions[S.sessions.length-1];
  if(!last)out.push(['', 'Zapisz pierwszy trening, a tutaj pojawią się wnioski z Twoich postępów.']);
  else{
    const days=Math.round((new Date(today())-new Date(last.date))/864e5);
    if(days>=5)out.push(['warn',`Ostatni trening był ${days} dni temu. Przerwa dłuższa niż tydzień zwykle cofa ciężary.`]);
    else out.push(['good',`Ostatni trening: ${fmtDate(last.date)} (${esc(last.dayName)}).`]);
    const since=new Date();since.setDate(since.getDate()-28);
    const cnt=S.sessions.filter(s=>new Date(s.date)>=since).length;
    out.push([cnt>=8?'good':'',`W ostatnich 4 tygodniach: <b class="num">${cnt}</b> treningów (${(cnt/4).toFixed(1).replace('.',',')} na tydzień).`]);
    allExercises().forEach(n=>{const h=exHistory(n).filter(x=>x.w>0);if(h.length<3)return;
      const a=h[0].w,b=h[h.length-1].w;
      const lastThree=h.slice(-3).map(x=>x.w);
      if(lastThree.every(v=>v===lastThree[0])&&h.length>=4)out.push(['warn',`${esc(n)}: ciężar stoi w miejscu od 3 treningów. Spróbuj dołożyć powtórzenie albo zmienić zakres.`]);
      else if(b>a)out.push(['good',`${esc(n)}: <b class="num">+${(b-a).toLocaleString('pl-PL')} kg</b> od ${fmtDate(h[0].date)}.`]);
    });
  }
  return out.slice(0,6);
}

/* ---------- TRENING ---------- */
function lastEntry(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].entries.find(x=>x.name===name);if(e&&e.sets.length)return e}return null}
function bestOf(name){let w=0,wr=0,r=0;S.sessions.forEach(s=>s.entries.forEach(e=>{if(e.name!==name)return;e.sets.forEach(x=>{const xw=+x.w||0,xr=+x.r||0;if(xw>w||(xw===w&&xr>wr)){w=xw;wr=xr}if(xr>r)r=xr})}));return w||r?{w,wr,r}:null}
const fmtKg=v=>(+v||0).toLocaleString('pl-PL');
function lastWeight(name){for(let i=S.sessions.length-1;i>=0;i--){const e=S.sessions[i].entries.find(x=>x.name===name);if(e)return topSet(e)}return''}
function startDraft(dayId){
  const day=findDay(dayId);if(!day)return;
  ui.dayId=dayId;
  ui.draft={date:today(),note:'',entries:day.exercises.map(e=>({name:e.name,sets:Array.from({length:e.sets},(_,i)=>{const le=lastEntry(e.name);const ls=le?(le.sets[i]||le.sets[le.sets.length-1]):null;return{w:ls?ls.w:'',r:ls&&ls.r?ls.r:e.reps,done:false}})}))};
}

    ${D.length?`<section class="stack"><div class="row between"><h2>${S.plans.length>1?'Plan':esc(P.name)}</h2>${S.plans.length>1?`<select id="plan-pick" aria-label="Aktywny plan" style="max-width:55%">${S.plans.map(p=>`<option value="${p.id}" ${p.id===S.activePlan?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`:''}</div>${D.map((d,i)=>`<div class="card daycard">${bodyMap(dayGroups(d),78,{views:'both'})}<div><div class="row between"><h3>${esc(d.name)}</h3>${i===nextIdx?'<span class="chip">Dziś</span>':''}</div>

      ${i===nextIdx?'':`<div><button data-act="start" data-id="${d.id}">Zacznij ten trening</button></div>`}</div></div>`).join('')}</section>`
      :`<div class="card"><p>${P?`Plan „${esc(P.name)}” nie ma jeszcze dni treningowych.`:'Nie masz jeszcze planu.'} Ułóż go w zakładce Planuj.</p><div><button class="primary" data-tab="planuj" data-sub="plany">Przejdź do planów</button></div></div>`}`;
  }
  const day=findDay(ui.dayId);
  return `<header class="top"><div><div class="eyebrow">W trakcie</div><h1>${esc(day?.name||'Trening')}</h1></div><input type="date" id="draft-date" value="${ui.draft.date}"></header>
  ${ui.draft.entries.map((e,ei)=>`<div class="card"><div class="exhead">${exGroup(e.name)?bodyMap([exGroup(e.name)],52):'<span></span>'}<div><h3><button class="exlink" data-act="exInfo" data-name="${esc(e.name)}">${esc(e.name)} <span class="infoi" aria-hidden="true">i</span></button></h3>${enName(e.name)?`<div class="en">${esc(enName(e.name))}</div>`:''}</div></div>${(()=>{const le=lastEntry(e.name),b=bestOf(e.name);if(!le&&!b)return '<div class="muted" style="font-size:.8rem">Pierwszy raz. Wpisz ciężar i powtórzenia.</div>';
      return `<div class="refs"><div><span class="eyebrow">Ostatnio</span><span class="num">${le?le.sets.map(x=>`${fmtKg(x.w)}×${x.r}`).join(' · '):'–'}</span></div><div><span class="eyebrow">Rekord</span><span class="num">${b?`${fmtKg(b.w)} kg × ${b.wr} · max ${b.r} powt.`:'–'}</span></div></div>`})()}

    <div class="row"><button class="ghost" data-act="addSet" data-i="${ei}">+ seria</button>${e.sets.length>1?`<button class="ghost" data-act="rmSet" data-i="${ei}">– seria</button>`:''}</div></div>`).join('')}

function chart(points,unit){
  if(points.length<2)return '<p class="muted">Za mało danych na wykres. Potrzebne są co najmniej dwa treningi.</p>';
  const W=560,H=200,pl=40,pr=12,pt=14,pb=26;
  const ys=points.map(p=>p.v);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1}
  const pad=(mx-mn)*.15;mn=Math.floor(mn-pad);mx=Math.ceil(mx+pad);
  const t0=+new Date(points[0].date),t1=+new Date(points[points.length-1].date)||t0+1;
  const X=d=>pl+(W-pl-pr)*((+new Date(d)-t0)/((t1-t0)||1)),Y=v=>pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));
  const ticks=[0,.5,1].map(f=>mn+(mx-mn)*f);
  const line=points.map((p,i)=>(i?'L':'M')+X(p.date).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const area=line+` L${X(points[points.length-1].date).toFixed(1)} ${H-pb} L${X(points[0].date).toFixed(1)} ${H-pb} Z`;
  const L=points[points.length-1];
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:320px" role="img" aria-label="Wykres postępu">
  ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${Y(t)+3}" text-anchor="end">${+t.toFixed(1)}</text>`).join('')}
  <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
  <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
  ${points.map(p=>`<circle cx="${X(p.date)}" cy="${Y(p.v)}" r="2.5" fill="var(--accent)"/>`).join('')}
  <circle cx="${X(L.date)}" cy="${Y(L.v)}" r="5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/>
  <text x="${pl}" y="${H-8}">${fmtDate(points[0].date)}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${fmtDate(L.date)}</text>
  </svg></div><div class="muted" style="font-size:.8rem">Jednostka: ${unit}</div>`;
}

function leaveExample(){if(S.example){S.example=false}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');if(t){if(t.dataset.sub)ui.sub=t.dataset.sub;go(t.dataset.tab);return}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='askClear'){ui.confirmClear=true}
  else if(a==='cancelClear'){ui.confirmClear=false}
  else if(a==='clearAll'){S={...S,example:false,sessions:[],bodyweight:[],notes:[]};ui.confirmClear=false;save();toast('Wyczyszczono historię. Plany zostały.')}
  else if(a==='sub'){ui.sub=b.dataset.s;scrollTo(0,0)}
  else if(a==='pickPlan'){ui.planId=id;ui.editPlan=null;ui.confirmRmPlan=null;ui.target=null}
  else if(a==='addPlan'){const p={id:uid(),name:'Nowy plan',days:[]};S.plans.push(p);if(!S.activePlan)S.activePlan=p.id;ui.planId=p.id;ui.editPlan=p.id;save()}
  else if(a==='editPlan'){ui.editPlan=id}
  else if(a==='activatePlan'){S.activePlan=id;save();toast('Trenujesz teraz planem: '+S.plans.find(p=>p.id===id).name)}
  else if(a==='dupPlan'){const o=S.plans.find(p=>p.id===id);const c={id:uid(),name:o.name+' (kopia)',days:o.days.map(d=>({id:uid(),name:d.name,exercises:d.exercises.map(e=>({...e,id:uid()}))}))};S.plans.push(c);ui.planId=c.id;save();toast('Utworzono kopię planu')}
  else if(a==='askRmPlan'){ui.confirmRmPlan=id}
  else if(a==='cancelRmPlan'){ui.confirmRmPlan=null}
  else if(a==='rmPlan'){S.plans=S.plans.filter(p=>p.id!==id);if(S.activePlan===id)S.activePlan=S.plans[0]?.id||null;ui.planId=null;ui.confirmRmPlan=null;save();toast('Usunięto plan. Historia treningów została.')}
  else if(a==='install'){if(installEvt){installEvt.prompt();installEvt.userChoice.finally(()=>{installEvt=null;render()})}return}
  else if(a==='hideInstall'){S.hideInstall=true;save();toast('Instrukcję znajdziesz w Planuj → Ustawienia')}
  else if(a==='grp'){ui.grp=b.dataset.g}
  else if(a==='eq'){ui.eq=b.dataset.e}
  else if(a==='exInfo'){ui.exInfo=b.dataset.name;document.getElementById('sheet').innerHTML=exSheet();document.querySelector('.sheet .primary')?.focus();return}
  else if(a==='exClose'){ui.exInfo=null;document.getElementById('sheet').innerHTML='';return}
  else if(a==='aiVoice'){voiceToggle();return}
  else if(a==='aiOpen'){ui.ai.open=true}
  else if(a==='aiClose'){if(voice.on)voiceToggle();ui.ai={...ui.ai,open:false,result:null,error:''}}
  else if(a==='aiNoPhoto'){ui.ai.photo=null;ui.ai.photoUrl=''}
  else if(a==='aiAsk'){if(voice.on)voiceToggle();
    const A=ui.ai;if(!A.desc.trim()&&!A.photo){A.error='Opisz ćwiczenie albo dodaj zdjęcie.';render();return}
    A.busy=true;A.error='';A.result=null;render();
    askAI(A.desc.trim(),A.photo).then(r=>{
      if(!r||!r.pl)throw new Error('AI nie rozpoznało ćwiczenia. Spróbuj dokładniej je opisać.');
      if(!DB.some(g=>g.en===r.group))r.group='Full Body & Conditioning';
      if(!EQUIP.some(e=>e[0]===r.eq))r.eq='inne';
      const d=findEx(r.pl)||findEx(r.en);if(d)r.dup=d.pl;
      A.result=r;
    }).catch(err=>{A.error=err?.code==='not_granted'?'Nie zezwolono aplikacji na użycie Claude.':err?.code==='rate_limited'?'Za dużo zapytań, spróbuj za chwilę.':(err?.message||'Nie udało się połączyć z AI.')})
    .finally(()=>{A.busy=false;if(tab==='planuj')render()});return}
  else if(a==='aiSave'){
    const v=id=>document.getElementById(id).value.trim();
    const R=ui.ai.result||{};const ex={pl:v('air-pl'),en:v('air-en'),groupEn:v('air-group'),eq:v('air-eq'),tip:R.tip||'',steps:Array.isArray(R.steps)?R.steps.slice(0,6).map(String):[],tips:Array.isArray(R.tips)?R.tips.slice(0,6).map(String):[]};
    if(!ex.pl){toast('Podaj nazwę polską');return}
    const known=findEx(ex.pl);
    if(!known){S.customEx=S.customEx||[];S.customEx.push(ex);rebuildDB()}
    const d=findDay(ui.target);
    const name=known?known.pl:ex.pl;
    if(d&&!d.exercises.some(e=>norm(e.name)===norm(name)))d.exercises.push({id:uid(),name,sets:3,reps:10});
    save();ui.ai={open:false,desc:'',photo:null,photoUrl:'',busy:false,result:null,error:''};ui.grp=DB.find(g=>g.en===(known?known.groupEn:ex.groupEn))?.group||'';ui.eq='';ui.q='';
    toast(known?'To ćwiczenie już było w bazie':'Dodano do bazy'+(d?' i do planu':''))}
  else if(a==='aiKeySave'){const k=document.getElementById('ai-key').value.trim();S.ai={...(S.ai||{}),model:document.getElementById('ai-model').value};if(k)S.ai.key=k;save();toast('Zapisano ustawienia AI')}
  else if(a==='aiKeyDel'){if(S.ai)delete S.ai.key;save();toast('Usunięto klucz')}
  else if(a==='addFromDb'){const d=findDay(ui.target);if(!d)return;d.exercises.push({id:uid(),name:b.dataset.name,sets:3,reps:10});save();document.getElementById('db-results').innerHTML=dbResults();toast('Dodano do: '+planOfDay(d.id).name+' · '+d.name);return}
  else if(a==='start'){startDraft(id)}
  else if(a==='cancelDraft'){ui.draft=null}
  else if(a==='addSet'){const en=ui.draft.entries[b.dataset.i];const l=en.sets[en.sets.length-1];en.sets.push({w:l?.w??'',r:l?.r??'',done:false})}
  else if(a==='rmSet'){ui.draft.entries[b.dataset.i].sets.pop()}
  else if(a==='finish'){
    const day=findDay(ui.dayId),plan=planOfDay(ui.dayId);
    const entries=ui.draft.entries.map(en=>({name:en.name,sets:en.sets.filter(s=>s.w!==''||s.r!=='').map(s=>({w:+String(s.w).replace(',','.')||0,r:+s.r||0}))})).filter(en=>en.sets.length);
    const recs=entries.map(en=>({name:en.name,from:bestOf(en.name)?.w||0,to:topSet(en)})).filter(x=>x.from>0&&x.to>x.from);
    setTimeout(()=>{scrollTo(0,0);recs.length&&celebrate(recs)},50);
    S.sessions.push({id:uid(),date:ui.draft.date,dayId:ui.dayId,dayName:day?.name||'Trening',planId:plan?.id,planName:plan?.name,entries,note:ui.draft.note.trim()});
    S.sessions.sort((x,y)=>x.date.localeCompare(y.date));ui.draft=null;save();toast('Trening zapisany')
  }
  else if(a==='addDay'){const p=S.plans.find(x=>x.id===id);if(!p)return;const d={id:uid(),name:'Nowy dzień',exercises:[]};p.days.push(d);ui.editDay=d.id;save()}
  else if(a==='editDay'){ui.editDay=id}
  else if(a==='saveDay'){const d=findDay(id);const v=document.getElementById('dn-'+id).value.trim();if(v)d.name=v;ui.editDay=null;save()}
  else if(a==='rmDay'){const p=planOfDay(id);if(p)p.days=p.days.filter(x=>x.id!==id);save();toast('Usunięto dzień')}
  else if(a==='rmEx'){const d=findDay(id);d.exercises=d.exercises.filter(x=>x.id!==b.dataset.ex);save()}
  else if(a==='rmNote'){S.notes=S.notes.filter(n=>n.id!==id);save()}
  else if(a==='copyBackup'){const txt=JSON.stringify(S);navigator.clipboard?.writeText(txt).then(()=>toast('Skopiowano dane'),()=>{const r=document.getElementById('restore');r.value=txt;r.select();toast('Zaznaczono dane, skopiuj ręcznie')});return}
  else if(a==='restore'){try{const v=JSON.parse(document.getElementById('restore').value);if(!(v.plan||v.plans)||!v.sessions)throw 0;S=v;migrate();rebuildDB();ui.planId=null;ui.target=null;save();toast('Przywrócono dane')}catch(err){toast('To nie wygląda na kopię z tej aplikacji');return}}
  render();
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.set){const[ei,si,k]=el.dataset.set.split(',');ui.draft.entries[ei].sets[si][k]=k==='done'?el.checked:el.value}
  else if(el.id==='ai-desc'){ui.ai.desc=el.value}
  else if(el.id==='db-q'){ui.q=el.value;document.getElementById('db-results').innerHTML=dbResults()}
  else if(el.id==='draft-note')ui.draft.note=el.value;
  else if(el.id==='draft-date')ui.draft.date=el.value;
});
document.addEventListener('change',e=>{if(e.target.id==='ai-photo'&&e.target.files[0]){const f=e.target.files[0];shrink(f).then(b=>{ui.ai.photo=b;if(ui.ai.photoUrl)URL.revokeObjectURL(ui.ai.photoUrl);ui.ai.photoUrl=URL.createObjectURL(b);render()})}if(e.target.id==='ex-pick'){ui.ex=e.target.value;render()}if(e.target.id==='plan-pick'){S.activePlan=e.target.value;save();render()}if(e.target.id==='db-target'){ui.target=e.target.value;document.getElementById('db-results').innerHTML=dbResults()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form;
  if(k==='addEx'){const id=f.dataset.id,n=document.getElementById('en-'+id).value.trim();if(!n)return;
    findDay(id).exercises.push({id:uid(),name:n,sets:+document.getElementById('es-'+id).value||3,reps:+document.getElementById('er-'+id).value||10});save()}
  if(k==='bw'){const kg=+document.getElementById('bw-kg').value.replace(',','.');if(!kg)return;S.bodyweight.push({date:document.getElementById('bw-date').value,kg});S.bodyweight.sort((a,b)=>a.date.localeCompare(b.date));save();toast('Zapisano wagę')}
  if(k==='planName'){const v=document.getElementById('pn-'+f.dataset.id).value.trim();const p=S.plans.find(x=>x.id===f.dataset.id);if(v&&p)p.name=v;ui.editPlan=null;save()}
  if(k==='note'){const tx=document.getElementById('note-text').value.trim();if(!tx)return;S.notes.push({id:uid(),date:document.getElementById('note-date').value,tag:document.getElementById('note-tag').value,text:tx});save();toast('Dodano obserwację')}
  render();
});
window.addEventListener('hashchange',()=>{const t=tabFromHash();if(t&&t!==tab){tab=t;render()}});
render();
</script>
<script>
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.exInfo){ui.exInfo=null;document.getElementById('sheet').innerHTML=''}document.querySelector('.celebrate')?.remove()}});
</script>
